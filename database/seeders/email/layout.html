<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{Subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, Helvetica, sans-serif;">
  <!-- Preview text shown by inbox lists -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">{{Preheader}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:20px 10px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%; max-width:600px; background-color:#ffffff; border-radius:6px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background:{{BrandColor}}; padding:30px; text-align:center;">
              <a href="{{SiteURL}}"><img src="{{LogoURL}}" alt="WWD" style="max-width:140px; margin-bottom:15px; border:0;"></a>
              <h1 style="color:#ffffff; margin:0; font-size:26px; line-height:1.3;">{{HeaderTitle}}</h1>
              <p style="color:#ffecec; margin:10px 0 0; font-size:16px;">{{HeaderSubtitle}}</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:30px; color:#333333; font-size:15px; line-height:1.6;">
              {{Content}}

              <p style="margin-top:25px;">
                Warm regards,<br>
                <strong>Team WWD</strong><br>
                <span style="color:#666666;">Your Business Discovery Partner</span>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#fafafa; padding:15px; text-align:center; font-size:12px; color:#777777; line-height:1.5;">
              &copy; {{Year}} WWD. All rights reserved.<br>
              {{FooterNote}}<br>
              Questions? Contact us at <a href="mailto:{{SupportEmail}}" style="color:#777777;">{{SupportEmail}}</a>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
